name: Check Links

# Validates that all links in Markdown files are accessible.
# Uses lychee for fast, reliable link checking.

on:
  workflow_dispatch:
  push:
    paths:
      - "**.md"
  pull_request:
    paths:
      - "**.md"
  # Run weekly to catch broken links from external changes
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

jobs:
  check-links:
    name: Check Markdown links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --verbose
            --no-progress
            --accept 100..=399
            --exclude-mail
            --exclude "^https://github.com/.*/(issues|pulls|compare)/.*$"
            --exclude "^https://example\\.com"
            --exclude-path .github/tests/fixtures/invalid-*.md
            "**/*.md"
          fail: true

      - name: Create link report
        if: failure()
        run: |
          echo "## Link Check Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Some links in the Markdown files are broken or inaccessible." >> $GITHUB_STEP_SUMMARY
          echo "Please review the workflow output for details." >> $GITHUB_STEP_SUMMARY
