name: Lint Markdown

# Validates Markdown files for style consistency and common errors.
# This workflow helps ensure high-quality Markdown content.

on:
  workflow_dispatch:
  push:
    paths:
      - "**.md"
      - ".markdownlint.json"
  pull_request:
    paths:
      - "**.md"
      - ".markdownlint.json"

permissions:
  contents: read

jobs:
  lint-markdown:
    name: Lint Markdown files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          markdownlint '**/*.md' \
            --ignore node_modules \
            --ignore .github/tests/fixtures/invalid-*.md \
            --config .markdownlint.json
